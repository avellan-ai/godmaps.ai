name: godmaps CI

# Upstream's ci.yml runs on pull requests and on pushes to main. This checks
# the branch this fork deploys from.
on:
  push:
    branches: [godmaps]
  pull_request:
    branches: [godmaps]

permissions:
  contents: read

concurrency:
  group: godmaps-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fork-rules:
    name: Hosted runners and upstream record
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse runners that GitHub does not host
        run: node scripts/godmaps-check-runners.mjs

      - name: Check the upstream record against git
        run: node scripts/godmaps-upstream-diff.mjs --check

  verify:
    name: Verify
    # Upstream's ci.yml already runs these checks on a pull request.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run every check
        run: node scripts/godmaps-check.mjs
